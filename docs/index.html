<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://avatars.githubusercontent.com/u/149693449?v=4" type="image/x-icon">
    <title>GitHub / RherPro / Gi2Test</title>
    <link rel="alternate" hreflang="en" href="/GitHub Gi2Test Pages/UIntCheck EN-US.html" />
    <link rel="alternate" hreflang="pt" href="/GitHub Gi2Test Pages/UIntCheck PT-BR.html" />
</head>
<body style>
    <iframe id="RedirectedContent" style="position:absolute; width:100vw; height:100vh; top:0px; left:0px; border:none;"></iframe>
<script>
    var PathStepsList = window.location.pathname.split("/").filter( String => String!="" );

    // Language => Language with location
    const Languages={
        "en": "EN-US",
        "pt": "PT-BR"
    };

    // PathStepsList => Html file path and name
    const HtmlRedirector=( (PathStepsList) => {
        if( PathStepsList.join("/")=="Gi2Test" )
            return "GitHub Gi2Test Pages/UIntCheck ${LangLoc}.html";
        //else if( PathStepsList.join("/")=="c%3A/Users/rherw/Desktop/RherProIndex/index.html" )
        //    return "GitHub Gi2Test Pages/UIntCheck ${LangLoc}.html";
        else
            return "404 ${LangLoc}.html";
    });
    
    if( Languages[PathStepsList[0].toLowerCase()] )
        LangLoc = Languages[PathStepsList.shift().toLowerCase()] ;
    else if( Languages[PathStepsList[PathStepsList.length-1].toLowerCase()] )
        LangLoc = Languages[PathStepsList.pop().toLowerCase()] ;
    else
        for (let Language of [...(navigator.languages || (navigator.userLanguage ? [navigator.userLanguage] : (navigator.language ? [navigator.language] : []))), "en"])
            if (LangLoc = Languages[Language.split("-")[0]]) break;
    document.getElementById('RedirectedContent').src = HtmlRedirector(PathStepsList).replace("${LangLoc}",LangLoc);
</script>
</body>
</html>
